<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/icon/ToDo_480px.png" type="image/x-icon">

</head>

<body>
    <div class="todo-app">
        <div class="todo-top">
            <h1>To-Do App</h1>
            <form id="form">
                <label for="text" class="text">Task:</label>
                <input class="task-text" type="text" id="text" placeholder="Task..." required>
                <button class="task-btn" type="submit">Add</button>
            </form>
        </div>
        <div class="todo-list">
            <ul class="list">

            </ul>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
